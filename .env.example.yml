# Copy to `.env.yml` and fill in. `.env.yml` is gitignored — never commit secrets.
env: development

server:
  port: 8006
  debugMode: true
  logLevel: debug

db:
  host: 127.0.0.1
  port: 3306
  username: accelerez
  password: accelerez
  database: accelerez

auth:
  # Production refuses to boot on this value — see main.ts. Generate one with:
  #   openssl rand -hex 32
  jwtSecret: change-me-in-env
  jwtExpiresIn: 7d

# Object storage for uploaded media. Blank means uploads are written to
# ./uploads and served from /uploads, which is fine for local work.
r2:
  accountId: ""
  accessKeyId: ""
  secretAccessKey: ""
  bucket: accelerez
  keyPrefix: ""
  publicBaseUrl: ""

seo:
  allowIndexing: false

base_url: http://localhost:4006
api_base_url: http://localhost:8006
